[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "sistema-prestamos-epcc"
version = "0.1.0"
description = "API para la gestión de préstamos de bienes de la EPCC"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.121",
  "pwdlib[argon2]>=0.2",
  "python-multipart>=0.0.20",
  "PyJWT>=2.10",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0.4",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Este archivo de conexión se conserva exactamente como fue entregado.
extend-exclude = ["scripts/polish_exam_pdf_figures.py", "app/conexion_python_base_datos.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = "app.conexion_python_base_datos"
# Sus anotaciones originales no se cambian; el adaptador sí se verifica.
ignore_errors = true
