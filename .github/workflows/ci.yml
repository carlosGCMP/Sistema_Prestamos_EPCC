name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: epcc_prestamos
          POSTGRES_USER: epcc
          POSTGRES_PASSWORD: epcc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epcc -d epcc_prestamos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://epcc:epcc@localhost:5432/epcc_prestamos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest
      - name: Check style
        run: ruff check .
      - name: Check formatting
        run: ruff format --check app migrations tests
      - name: Check types
        run: mypy
