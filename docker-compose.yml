services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: epcc_prestamos
      POSTGRES_USER: epcc
      POSTGRES_PASSWORD: epcc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epcc -d epcc_prestamos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
